<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/trellis.css" type="text/css"?>
<?xml-stylesheet href="chrome://trellis-platform/content/trellis.css" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/scaffold.css" type="text/css"?>
<!DOCTYPE window SYSTEM "chrome://trellis/locale/trellis.dtd">
<window xmlns:html="http://www.w3.org/1999/xhtml"
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	id="trellis-select-item-dialog"
	class="trellis-dialog"
	title="&trellis.selectitems.title;"
	persist="width height"
	drawintitlebar-platforms="mac"
	onload="Trellis_Ingester_Interface_SelectItems.init()">
<dialog 
	buttons="cancel,accept"
	id="trellis-selectitems">

	<script>
		Services.scriptloader.loadSubScript("chrome://trellis/content/include.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/titlebar.js", this);
		Services.scriptloader.loadSubScript("chrome://scaffold/content/select.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/customElements.js", this);
	</script>
	
	<richlistbox id="trellis-selectitems-links"></richlistbox>
	<hbox id="trellis-select-items-buttons">
		<button label="Select All" oncommand="Trellis_Ingester_Interface_SelectItems.selectAll()"/>
		<button label="Deselect All" oncommand="Trellis_Ingester_Interface_SelectItems.selectAll(true)"/>
	</hbox>
</dialog>
</window>
