<?xml-stylesheet href="chrome://global/skin/global.css"?>
<?xml-stylesheet href="chrome://trellis-platform/content/trellis.css"?>

<!DOCTYPE window [
	<!ENTITY % cslpreviewDTD SYSTEM "chrome://trellis/locale/cslpreview.dtd"> %cslpreviewDTD;
	<!ENTITY % trellisDTD SYSTEM "chrome://trellis/locale/trellis.dtd"> %trellisDTD;
]>

<window
	id="csl-preview"
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	onload="Trellis_CSL_Preview.init();"
	title="&styles.preview;">
	
	<script src="chrome://trellis/content/include.js"/>
	<script src="cslpreview.js"/>

	<vbox flex="1">
		<hbox align="center">
			<button id="preview-refresh-button" label="&trellis.general.refresh;" oncommand="Trellis_CSL_Preview.refresh()"/>
			
			<label value="&styles.preview.citationFormat;" />
			<menulist id="citation-format" oncommand="Trellis_CSL_Preview.refresh()" native="true">
				<menupopup>
					<menuitem value="all" label="&styles.preview.citationFormat.all;"/>
					<menuitem value="author" label="&styles.preview.citationFormat.author;"/>
					<menuitem value="author-date" label="&styles.preview.citationFormat.authorDate;"/>
					<menuitem value="label" label="&styles.preview.citationFormat.label;"/>
					<menuitem value="note" label="&styles.preview.citationFormat.note;"/>
					<menuitem value="numeric" label="&styles.preview.citationFormat.numeric;"/>
				</menupopup>
			</menulist>
			
			<menulist id="locale-menu" oncommand="Trellis.Prefs.set('export.lastLocale', this.value); Trellis_CSL_Preview.refresh()" native="true"/>
		</hbox>
		<iframe id="trellis-csl-preview-box" flex="1" overflow="auto" type="content"/>
	</vbox>
	
	<keyset>
		<key id="key_close" key="W" modifiers="accel" oncommand="window.close()"/>
	</keyset>

</window>
