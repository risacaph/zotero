<vbox id="trellis-prefpane-account" onload="Trellis_Preferences.Sync.init()">
	<vbox class="main-section">
		<vbox id="sync-unauthorized">
			<description data-l10n-id="preferences-sync-data-syncing-description"/>

			<hbox>
				<vbox>
					<hbox class="account-login-default">
						<button data-l10n-id="preferences-account-log-in"
							oncommand="Trellis_Preferences.Sync.linkAccount(event)"/>
					</hbox>
					<hbox class="account-login-pending" hidden="true" align="center">
						<label class="account-login-status-indicator"/>
						<label data-l10n-id="preferences-account-waiting-for-login"/>
						<button data-l10n-id="preferences-account-cancel-button"
							oncommand="Trellis_Preferences.Sync.cancelLogin()"/>
					</hbox>
				</vbox>

				<vbox style="width:2em"/>
				<vbox>
					<label is="trellis-text-link" value="&trellis.preferences.sync.createAccount;" href="http://trellis.org/user/register"/>
					<separator class="thin"/>
					<label is="trellis-text-link" value="&trellis.preferences.sync.about;" href="http://www.trellis.org/support/sync"/>
				</vbox>
			</hbox>
		</vbox>

		<vbox id="account-linked" hidden="true">
			<html:div class="form-grid">
				<label value="&trellis.preferences.sync.username;"/>
				<hbox>
					<label id="account-username" value=""/>
					<!-- Logged in -->
					<button id="account-log-out-button"
						data-l10n-id="preferences-account-log-out"
						aria-describedby="account-username"
						oncommand="Trellis_Preferences.Sync.unlinkAccount()"
						hidden="true"/>
					<!-- Logged out -->
					<label data-l10n-id="preferences-account-logged-out-status"
						class="account-logged-out-status" hidden="true"/>
				</hbox>

				<label id="account-email-label"
					data-l10n-id="preferences-account-email-label"
					hidden="true"/>
				<vbox id="account-emails" hidden="true"/>
			</html:div>

			<!-- Logged out: login/switch buttons -->
			<vbox id="account-logged-out-actions" style="margin-top: 8px" hidden="true">
				<hbox class="account-login-default" style="gap: 8px">
					<button data-l10n-id="preferences-account-log-in"
						oncommand="Trellis_Preferences.Sync.linkAccount(event)"/>
					<button data-l10n-id="preferences-account-switch-accounts"
						oncommand="Trellis_Preferences.Sync.switchAccounts()"/>
				</hbox>
				<hbox class="account-login-pending" hidden="true" align="center">
					<label class="account-login-status-indicator"/>
					<label data-l10n-id="preferences-account-waiting-for-login"/>
					<button data-l10n-id="preferences-account-cancel-button"
						oncommand="Trellis_Preferences.Sync.cancelLogin()"/>
				</hbox>
			</vbox>
		</vbox>
	</vbox>

	<vbox class="main-section" id="sync-settings-section" hidden="true">
		<html:h1 data-l10n-id="preferences-sync-settings-heading"/>
		<description data-l10n-id="preferences-sync-settings-intro">
			<label is="trellis-text-link" href="http://www.trellis.org/support/sync" data-l10n-name="sync-link"/>
		</description>
		<separator class="thin"/>

		<groupbox>
			<html:div class="form-grid">
				<box/>
				<checkbox
					label="&trellis.preferences.sync.syncAutomatically;"
					preference="extensions.trellis.sync.autoSync"
					native="true"/>

				<box/>
				<checkbox
					label="&trellis.preferences.sync.syncFullTextContent;"
					preference="extensions.trellis.sync.fulltext.enabled"
					tooltiptext="&trellis.preferences.sync.syncFullTextContent.desc;"
					native="true"/>

				<box/>
				<box>
					<button id="sync-libraries-button" label="&trellis.preferences.sync.librariesToSync.button;"
						oncommand="Trellis_Preferences.Sync.showLibrariesToSyncDialog()"
						data-search-strings="trellis.preferences.sync.librariesToSync"/>
				</box>
			</html:div>
		</groupbox>

		<groupbox id="storage-settings" aria-label="&trellis.preferences.sync.fileSyncing;">
			<label><html:h2>&trellis.preferences.sync.fileSyncing;</html:h2></label>

				<!-- My Library -->
				<hbox>
					<checkbox label="&trellis.preferences.sync.fileSyncing.myLibrary;"
						preference="extensions.trellis.sync.storage.enabled"
						oncommand="Trellis_Preferences.Sync.onStorageSettingsChange()"
						native="true"/>
					<menulist id="storage-protocol" class="storage-personal"
						style="margin-left: .5em"
						aria-label="&trellis.preferences.sync.fileSyncing.myLibrary;"
						preference="extensions.trellis.sync.storage.protocol"
						oncommand="Trellis_Preferences.Sync.onStorageSettingsChange()"
						native="true">
						<menupopup>
							<menuitem label="Trellis Storage" value="trellis"/>
							<menuitem label="WebDAV" value="webdav"/>
						</menupopup>
					</menulist>
				</hbox>

				<stack id="storage-webdav-settings" style="margin-top: .5em; margin-bottom: .8em; border: 1px gray solid; border-radius: 3px">
					<!-- Background shading -->
					<box style="background: black; opacity:.03"/>

					<grid class="form-grid">
						<label control="storage-url-prefix" value="&trellis.preferences.sync.fileSyncing.url;"/>
						<hbox>
							<menulist id="storage-url-prefix"
								preference="extensions.trellis.sync.storage.scheme"
								style="padding: 0; width: 7em"
								native="true">
								<menupopup>
									<menuitem label="https" value="https"/>
									<menuitem label="http" value="http"/>
								</menupopup>
							</menulist>
							<label value="://"/>
							<html:input id="storage-url" style="flex: 1;"
								aria-label="&trellis.preferences.sync.fileSyncing.url;"
								preference="extensions.trellis.sync.storage.url"
								onkeypress="Trellis_Preferences.Sync.onStorageSettingsKeyPress(event)"
								onchange="Trellis_Preferences.Sync.onStorageSettingsChange()"/>
							<label value="/trellis/"/>
						</hbox>

						<label control="storage-username" value="&trellis.preferences.sync.username;"/>
						<hbox>
							<html:input id="storage-username"
								preference="extensions.trellis.sync.storage.username"
								onkeypress="Trellis_Preferences.Sync.onStorageSettingsKeyPress(event)"
								onchange="Trellis_Preferences.Sync.onStorageSettingsChange()"/>
						</hbox>

						<label control="storage-password" value="&trellis.preferences.sync.password;"/>
						<hbox>
							<html:input id="storage-password" type="password"
								onkeypress="Trellis_Preferences.Sync.onStorageSettingsKeyPress(event)"
								onchange="Trellis_Preferences.Sync.onStorageSettingsChange()"/>
						</hbox>

						<box/>
						<hbox>
							<button id="storage-verify" label="&trellis.preferences.sync.fileSyncing.verifyServer;"
								oncommand="Trellis_Preferences.Sync.verifyStorageServer()"/>
							<button id="storage-abort" label="Stop" hidden="true"/>
							<progressmeter id="storage-progress" hidden="true"
								mode="undetermined"/>
						</hbox>
					</grid>

				</stack>

				<hbox class="storage-settings-download-options" align="center">
					<label control="storage-user-download-mode" value="&trellis.preferences.sync.fileSyncing.download;"/>
					<menulist id="storage-user-download-mode"
						class="storage-mode"
						preference="extensions.trellis.sync.storage.downloadMode.personal"
						style="margin-left: 0"
						native="true">
						<menupopup>
							<menuitem label="&trellis.preferences.sync.fileSyncing.download.onDemand;" value="on-demand"/>
							<menuitem label="&trellis.preferences.sync.fileSyncing.download.atSyncTime;" value="on-sync"/>
						</menupopup>
					</menulist>
				</hbox>

				<separator id="storage-separator" class="thin"/>

				<!-- Group Libraries -->
				<checkbox data-l10n-id="preferences-sync-fileSyncing-groups"
					preference="extensions.trellis.sync.storage.groups.enabled"
					oncommand="Trellis_Preferences.Sync.updateStorageSettingsGroupsUI()"
					native="true"/>

				<hbox class="storage-settings-download-options" align="center">
					<label control="storage-groups-download-mode" value="&trellis.preferences.sync.fileSyncing.download;"/>
					<menulist id="storage-groups-download-mode"
						class="storage-mode"
						preference="extensions.trellis.sync.storage.downloadMode.groups"
						style="margin-left: 0"
						native="true">
						<menupopup>
							<menuitem label="&trellis.preferences.sync.fileSyncing.download.onDemand;" value="on-demand"/>
							<menuitem label="&trellis.preferences.sync.fileSyncing.download.atSyncTime;" value="on-sync"/>
						</menupopup>
					</menulist>
				</hbox>

				<separator class="thin"/>

				<vbox id="storage-terms">
					<description style="margin-top: .4em" data-l10n-id="preferences-sync-fileSyncing-tos">
						<label is="trellis-text-link" href="https://www.trellis.org/support/terms/terms_of_service" data-l10n-name="terms-link"/>
					</description>
				</vbox>
		</groupbox>
	</vbox>

	<vbox class="main-section" id="sync-reset" align="start" aria-label="&trellis.preferences.sync.reset;" role="group">
		<html:h1 data-l10n-id="preferences-sync-reset-heading"/>
		<button label="&trellis.preferences.sync.reset.showResetOptions;" oncommand="Trellis_Preferences.navigateToPane('trellis-subpane-reset-sync')"
			data-search-strings="
				trellis.preferences.sync.reset.restoreToOnlineLibrary,
				trellis.preferences.sync.reset.restoreToOnlineLibrary.desc,
				trellis.preferences.sync.reset.fileSyncHistory,
				trellis.preferences.sync.reset.resetFileSyncHistory.desc,
				trellis.preferences.sync.reset.warning2"/>
	</vbox>
</vbox>
