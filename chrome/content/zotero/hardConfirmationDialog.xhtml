<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://global/content/commonDialog.css" type="text/css"?>
<?xml-stylesheet href="chrome://global/skin/commonDialog.css" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/hardConfirmationDialog.css" type="text/css"?>

<!DOCTYPE overlay [ <!ENTITY % trellisDTD SYSTEM "chrome://trellis/locale/trellis.dtd"> %trellisDTD; ]>

<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
		xmlns:html="http://www.w3.org/1999/xhtml"
		id="trellis-hardConfirmationDialog"
		title=""
		onload="Trellis.HardConfirmationDialog.init(); sizeToContent();"
		style="display: flex;">
<dialog 
	buttons="cancel,accept"
	id="commonDialog">
	
	<script src="chrome://trellis/content/include.js"/>
	<script src="hardConfirmationDialog.js"/>
	
	<hbox>
		<hbox id="iconContainer" align="start"><image id="info.icon" class="spaced alert-icon"/></hbox>
		<vbox id="infoContainer" flex="1">
			<description id="infoTitle" hidden="true"/>
			<description id="infoBody"/>
			
			<separator class="thin"/>

			<checkbox id="trellis-hardConfirmationDialog-checkbox" hidden="true" oncommand="Trellis.HardConfirmationDialog.onCheckbox(event)" native="true"/>
			<html:input id="trellis-hardConfirmationDialog-textbox" type="text" hidden="true" onkeyup="Trellis.HardConfirmationDialog.onKeyUp(event)"/>
		</vbox>
	</hbox>
</dialog>
</window>
