<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://global/skin/browser.css" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/trellis.css" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/progressWindow.css"?>
<!DOCTYPE window SYSTEM "chrome://trellis/locale/trellis.dtd">

<window id="trellis-progress"
        xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
		xmlns:html="http://www.w3.org/1999/xhtml"
		title="&trellis.progress.title;"
        drawintitlebar-platforms="win,linux"
        style="min-width: 300px"
        windowtype="alert:alert">
		
	<vbox id="trellis-progress-text-box" flex="1" style="padding: 10px">
		<hbox id="trellis-progress-text-headline" align="stretch">
			<label id="progress-label" flex="1"/>
		</hbox>
	</vbox>
	<script>
        var { Trellis } = ChromeUtils.importESModule("chrome://trellis/content/trellis.mjs");
        Services.scriptloader.loadSubScript("chrome://trellis/content/titlebar.js", this);
	</script>
</window>
