<!DOCTYPE prefwindow SYSTEM "chrome://trellis/locale/preferences.dtd">

<?xml-stylesheet href="chrome://global/skin/global.css"?>
<?xml-stylesheet href="chrome://trellis-platform/content/preferences.css"?>
<?xml-stylesheet href="chrome://trellis/skin/preferences.css"?>
<?xml-stylesheet href="chrome://trellis-platform/content/trellis.css"?>

<window
	id="trellis-locate-manager-prefs"
	title="&trellis.preferences.title;" onload="init()"
	windowtype="trellis:pref"
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	style="display: flex; padding: 15px;">

	<script src="include.js"></script>
	<script src="locateManager.js"></script>
	
	<keyset>
		<key id="key_close" modifiers="accel" key="W" oncommand="window.close()"/>
	</keyset>

	<groupbox flex="1">
		<label><html:h2>&trellis.preferences.locate.locateEngineManager;</html:h2></label>
		
		<vbox class="groupbox-body" flex="1">
			<label id="locate-engine-description" style="font-size: 12px; width: 45em;"/>
			
			<separator class="thin"/>
			
			<hbox class="virtualized-table-container" flex="1" style="min-height: 100px;">
				<html:div id="locateManager-tree"/>
			</hbox>
			
			<separator class="thin"/>
			
			<hbox id="button-bar">
				<hbox pack="start">
					<button label="Toggle" onclick="toggleLocateEngines()" />
					<button id="locateManager-restoreDefaults" label="&trellis.preferences.locate.restoreDefaults;" oncommand="restoreDefaultLocateEngines()" />
				</hbox>
				<hbox pack="end">
					<button disabled="true" id="locateManager-delete" label="-" oncommand="deleteLocateEngine()" />
				</hbox>
			</hbox>

			<!--
			TODO: Restore a way to add these
			<separator class="thin"/>
			<label id="addLocateEngineDescription" style="font-size: 10px; width: 45em; height: 6em">
				&trellis.preferences.locate.addDescription;
			</label>
			-->
		</vbox>
	</groupbox>

	<script>
		document.getElementById('locate-engine-description').textContent = Trellis.getString('locate.locateEngineDescription', Trellis.appName);
	</script>
</window>
