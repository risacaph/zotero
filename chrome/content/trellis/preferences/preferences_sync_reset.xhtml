<vbox class="main-section subpane" id="sync-reset" onload="Trellis_Preferences.Sync.initResetPane()">
	<html:h1 data-l10n-id="preferences-sync-reset-heading"/>

	<!-- This doesn't wrap without an explicit width, for some reason -->
	<description id="reset-sync-warning" width="45em">&trellis.preferences.sync.reset.warning1;<label style="margin-left: 0; margin-right: 0" is="trellis-text-link" href="http://trellis.org/support/kb/sync_reset_options">&trellis.preferences.sync.reset.warning2;</label>&trellis.preferences.sync.reset.warning3;</description>
	
	<div id="sync-reset-form" xmlns="http://www.w3.org/1999/xhtml"
			xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul">
		<div id="sync-reset-library-menu-container">
			<label for="sync-reset-library-menu">Library:</label>
			<xul:menulist id="sync-reset-library-menu" native="true"><xul:menupopup/></xul:menulist>
		</div>
		
		<xul:radiogroup id="sync-reset-radiogroup">
			<!--<li>
				<p>&trellis.preferences.sync.reset.restoreFromServer;</p>
				<p>&trellis.preferences.sync.reset.restoreFromServer.desc;</p>
			</li>-->
			
			<div id="restore-to-server">
				<xul:radio value="restore-to-server" label="&trellis.preferences.sync.reset.restoreToOnlineLibrary;"/>
				<span class="sync-reset-option-desc">&trellis.preferences.sync.reset.restoreToOnlineLibrary.desc;</span>
			</div>
			
			<!--<li>
				<h2>&trellis.preferences.sync.reset.resetDataSyncHistory;</h2>
				<description>&trellis.preferences.sync.reset.resetDataSyncHistory.desc;</p>
			</li>-->
			
			<div id="reset-file-sync-history">
				<xul:radio value="reset-file-sync-history" label="&trellis.preferences.sync.reset.resetFileSyncHistory;"/>
				<span class="sync-reset-option-desc">&trellis.preferences.sync.reset.resetFileSyncHistory.desc;</span>
			</div>
		</xul:radiogroup>
		
		<button id="sync-reset-button"
			disabled="disabled"
			onclick="Trellis_Preferences.Sync.reset()">&trellis.preferences.sync.reset.button;</button>
	</div>
</vbox>
