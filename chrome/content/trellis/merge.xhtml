<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/trellis.css" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/merge.css" type="text/css"?>
<?xml-stylesheet href="chrome://trellis-platform/content/trellis.css"?>

<!DOCTYPE window SYSTEM "chrome://trellis/locale/trellis.dtd">

<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
		xmlns:html="http://www.w3.org/1999/xhtml"
		onload="Trellis_Merge_Window.init()"
		drawintitlebar-platforms="mac"
		style="min-width: 850px; min-height: 500px;"
>
	<wizard id="merge-window" title="">
		<linkset>
			<html:link rel="localization" href="toolkit/global/textActions.ftl"/>
			<html:link rel="localization" href="toolkit/global/wizard.ftl"/>
		</linkset>

		<script>
			Services.scriptloader.loadSubScript("chrome://trellis/content/include.js", this);
			Services.scriptloader.loadSubScript("chrome://trellis/content/customElements.js", this);
			Services.scriptloader.loadSubScript("chrome://trellis/content/titlebar.js", this);
			Services.scriptloader.loadSubScript("chrome://trellis/content/platformKeys.js", this);
			Services.scriptloader.loadSubScript("chrome://global/content/globalOverlay.js", this);
			Services.scriptloader.loadSubScript("chrome://trellis/content/editMenuOverlay.js", this);
			Services.scriptloader.loadSubScript("chrome://trellis/content/components/annotation.js", this);
			Services.scriptloader.loadSubScript("chrome://trellis/content/merge.js", this);
		</script>
		
		<wizardpage label="&trellis.merge.title;" pageid="page-id">
			<html:span id="trellis-merge-instructions"></html:span>
			<merge-group flex="1"/>
			<separator class="thin"/>
			<hbox align="center">
				<separator orient="vertical" flex="1"/>
				<hbox>
					<checkbox id="resolve-all" native="true"
						oncommand="Trellis_Merge_Window.updateNextFinish()"/>
				</hbox>
				<separator orient="vertical"/>
				<hbox id="trellis-step-count">
					<label id="trellis-merge-num-objects"/>
					<label value="&trellis.merge.of;"/>
					<label id="trellis-merge-total-objects"/>
				</hbox>
			</hbox>
		</wizardpage>
	</wizard>
</window>
