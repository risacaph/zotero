<?xml version="1.0"?>

<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/errorReport.css" type="text/css"?>
<?xml-stylesheet href="chrome://trellis-platform/content/trellis.css"?>

<!DOCTYPE window SYSTEM "chrome://trellis/locale/trellis.dtd">

<window
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	onload="Trellis_Error_Report.init()">

<linkset>
	<html:link rel="localization" href="toolkit/global/wizard.ftl"/>
</linkset>

<script>
	Services.scriptloader.loadSubScript("chrome://trellis/content/include.js", this);
	Services.scriptloader.loadSubScript("chrome://trellis/content/customElements.js", this);
</script>

<wizard title="&trellis.errorReport.title;" width="550" height="450">
	<script>
	<![CDATA[
		const { TRELLIS_CONFIG } = ChromeUtils.importESModule('resource://trellis/config.mjs');
		
		var Trellis_Error_Report = new function() {
			var obj = window.arguments[0].wrappedJSObject;
			var Trellis = obj.Trellis;
			var data = obj.data;
			var msg = data.msg;
			var errorData = data.errorData;
			var extraData = data.extraData ? data.extraData : '';
			var diagnosticInfo = false;
			
			
			this.init = async function () {
				// Allow Continue button to be populated
				await Trellis.Promise.delay(100);
				
				var wizard = document.querySelector('wizard');
				var continueButton = wizard.getButton('next');
				continueButton.disabled = true;
				
				diagnosticInfo = await Trellis.getSystemInfo();
				var errorDataText = errorData.length
					? data.errorData.join('\n\n')
					: Trellis.getString('errorReport.noErrorsLogged', Trellis.appName);
				
				var logText = errorDataText + '\n\n'
					+ (extraData !== '' ? extraData + '\n\n' : '')
					+ diagnosticInfo;
				
				if (document.getElementById('trellis-failure-message').hasChildNodes()) {
					var textNode = document.getElementById('trellis-failure-message').firstChild;
					document.getElementById('trellis-failure-message').removeChild(textNode);
				}
				
				document.getElementById('trellis-failure-message').appendChild(document.createTextNode(msg));
				document.getElementById('trellis-error-message').value = logText;
				
				continueButton.disabled = false;
				continueButton.focus();
				var str = Trellis.getString(
					'errorReport.advanceMessage', continueButton.getAttribute('label')
				);
				document.getElementById('trellis-advance-message').setAttribute('value', str);
				
				var pageSending = document.querySelector('wizardpage[pageid="report-sending"]');
				pageSending.addEventListener('pageshow', () => Trellis_Error_Report.sendErrorReport());
			};
			
			this.sendErrorReport = async function () {
				var wizard = document.querySelector('wizard');
				var continueButton = wizard.getButton('next');
				continueButton.disabled = true;
				
				var parts = {
					error: "true",
					errorData: errorData.join('\n'),
					extraData: extraData,
					diagnostic: diagnosticInfo
				};
				
				var body = '';
				for (var key in parts) {
					body += key + '=' + encodeURIComponent(parts[key]) + '&';
				}
				body = body.substr(0, body.length - 1);
				var req = await Trellis.HTTP.request(
					"POST",
					TRELLIS_CONFIG.REPOSITORY_URL + "report",
					{
						body,
						successCodes: false,
						foreground: true
					}
				);
				_sendErrorReportCallback(req);
			};
			
			
			function _sendErrorReportCallback(xmlhttp) {
				var wizard = document.querySelector('wizard');
				if (!wizard) {
					return;
				}
				
				var ps = Services.prompt;
				
				if (!xmlhttp.responseXML){
					try {
						if (xmlhttp.status>1000){
							ps.alert(
								null,
								Trellis.getString('general.error'),
								Trellis.getString('errorReport.noNetworkConnection')
							);
						}
						else {
							ps.alert(
								null,
								Trellis.getString('general.error'),
								Trellis.getString('errorReport.invalidResponseRepository')
							);
						}
					}
					catch (e){
						ps.alert(
							null,
							Trellis.getString('general.error'),
							Trellis.getString('errorReport.repoCannotBeContacted')
						);
					}
					
					wizard.rewind();
					return;
				}
				
				
				var reported = xmlhttp.responseXML.getElementsByTagName('reported');
				if (reported.length != 1) {
					ps.alert(
						null,
						Trellis.getString('general.error'),
						Trellis.getString('errorReport.invalidResponseRepository')
					);
					wizard.rewind();
					return;
				}
				
				wizard.advance();
				wizard.getButton('cancel').disabled = true;;
				wizard.canRewind = false;
				var reportID = reported[0].getAttribute('reportID');
				document.getElementById('trellis-report-id').setAttribute('value', reportID);
				document.getElementById('trellis-report-result').hidden = false;
			}
		}
	]]>
	</script>
	
	<wizardpage
			id="report-start"
			pageid="report-start"
			next="report-sending"
			data-header-label-id="">
		<description id="trellis-failure-message"/>
		<html:textarea
				id="trellis-error-message"
				class="plain"
				readonly="true"
				multiline="true"
		/>
		<description id="trellis-advance-message"/>
	</wizardpage>
	
	<wizardpage
			pageid="report-sending"
			next="report-submitted"
			onpageshow="Trellis_Error_Report.sendErrorReport()"
			data-header-label-id="">
		<description>&trellis.errorReport.submissionInProgress;</description>
	</wizardpage>
	
	<wizardpage
			pageid="report-submitted"
			data-header-label-id="">
		<description>&trellis.errorReport.submitted;</description>
		<description id="trellis-report-result" hidden="true">
			&trellis.errorReport.reportID;
			<html:input id="trellis-report-id" type="text" class="plain" readonly="true"/>
		</description>
		<description>&trellis.errorReport.postToForums;</description>
		<description>&trellis.errorReport.notReviewed;</description>
	</wizardpage>
</wizard>
</window>
