<?xml version="1.0"?>

<?xml-stylesheet href="chrome://global/skin/"?>
<?xml-stylesheet href="chrome://trellis-platform/content/trellis.css"?>

<!DOCTYPE window SYSTEM "chrome://trellis/locale/trellis.dtd">

<window
		id="dictionary-manager"
		xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
		xmlns:html="http://www.w3.org/1999/xhtml"
		xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
		onload="Trellis_Dictionary_Manager.init()"
		windowtype="trellis:dictionaries">
	
	<script src="chrome://global/content/globalOverlay.js"/>
	<script src="include.js"/>
	<script src="commonDialog.js"/>
	<script src="dictionaryManager.js"/>
	
	<vbox id="DictionaryManager" flex="1">
		<richlistbox id="dictionaries" flex="1" tabindex="0"/>
		
		<html:div id="status">&#xA0;</html:div>
		
		<hbox class="dialog-button-box">
			<button dlgtype="cancel" label="&trellis.general.cancel;" oncommand="window.close()"/>
			<button dlgtype="accept" default="true" label="&trellis.general.ok;"
				oncommand="Trellis_Dictionary_Manager.handleAccept()"/>
		</hbox>
	</vbox>
	
	<keyset>
		<key id="key_close" key="W" modifiers="accel" oncommand="window.close()"/>
	</keyset>
</window>
