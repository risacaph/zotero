<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/trellis.css" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/about.css" type="text/css"?>
<?xml-stylesheet href="chrome://trellis-platform/content/trellis.css" type="text/css"?>
<!DOCTYPE window SYSTEM "chrome://trellis/locale/about.dtd">

<window
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	onload="moveToAlertPosition(); sizeToContent(); document.getElementById('trellis-about').getButton('accept').focus();"
	inwindowmenu="false">
	<script>
		Services.scriptloader.loadSubScript("chrome://trellis/content/include.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/customElements.js", this);
	</script>
<dialog
		id="trellis-about"
		class="trellis-window"
		buttons="accept"
		buttonlabelaccept="&trellis.about.close;"
		ondialogaccept="return true;">
	
	<vbox id="aboutcontent" class="trellis-dialog">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<img id="logo" src="chrome://trellis/skin/trellis.svg" alt="Trellis" />
		</div>
		<hbox>
			<label id="version"/>
			<label id="changelog" is="trellis-text-link" value="&trellis.whatsNew;"/>
		</hbox>
		<script>
			var version = Trellis.version;
			if (!Trellis.isMac) {
				version += ` (${Services.appinfo.is64Bit ? '64' : '32'}-bit)`;
			}
			document.getElementById('version').textContent = version
		</script>
		<vbox>
			<div id="about-text" xmlns="http://www.w3.org/1999/xhtml">
				<p id="created-by"></p>
				<p id="third-party-software"></p>
				<p id="get-involved"></p>
				<script><![CDATA[
					const { TRELLIS_CONFIG } = ChromeUtils.importESModule('resource://trellis/config.mjs');
					
					document.getElementById('changelog').href = TRELLIS_CONFIG.CHANGELOG_URL;
					
					// Replace [links] in localized strings with spans with onclick handlers
					//
					// TODO: Use helper function in common with intro text in itemTreeView.js
					document.getElementById('created-by').innerHTML =
						Trellis.Utilities.htmlSpecialChars(
							Trellis.getString(
								'about.createdBy',
								[Trellis.appName, `[${TRELLIS_CONFIG.PRODUCER}]`]
							),
						)
						.replace(
							/\[([^\]]+)](.+)\[([^\]]+)]/,
							`<span data-href="${TRELLIS_CONFIG.PRODUCER_URL}">$1</span>`
								+ '$2'
								+ `<span data-href="${TRELLIS_CONFIG.CREDITS_URL}">$3</span>`
						);
					
					document.getElementById('third-party-software').innerHTML =
						Trellis.Utilities.htmlSpecialChars(
							Trellis.getString('about.openSource', Trellis.appName)
						)
						.replace(
							/\[([^\]]+)](.+)\[([^\]]+)]/,
							`<span data-href="${TRELLIS_CONFIG.LICENSING_URL}">$1</span>`
								+ '$2'
								+ `<span data-href="${TRELLIS_CONFIG.CREDITS_URL}#third-party_software">$3</span>`
						);
					
					document.getElementById('get-involved').innerHTML =
						Trellis.Utilities.htmlSpecialChars(Trellis.getString('about.getInvolved'))
						.replace(
							/\[([^\]]+)]/,
							`<span data-href="${TRELLIS_CONFIG.GET_INVOLVED_URL}">$1</span>`
						);
					
					// Activate text links
					for (let span of document.getElementById('about-text').getElementsByTagName('span')) {
						span.className = 'text-link';
						span.setAttribute('role', 'link');
						span.onclick = function () {
							Trellis.launchURL(this.getAttribute('data-href'));
						};
					}
				]]></script>
			</div>
		</vbox>
	</vbox>
</dialog>
</window>
