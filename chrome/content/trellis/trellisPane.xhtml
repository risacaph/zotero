<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://trellis/skin/trellis.css" type="text/css"?>

<!DOCTYPE window [
	<!ENTITY % standaloneDTD SYSTEM "chrome://trellis/locale/standalone.dtd" > %standaloneDTD;
	<!ENTITY % editMenuOverlayDTD SYSTEM "chrome://trellis/locale/mozilla/editMenuOverlay.dtd" > %editMenuOverlayDTD;
	<!ENTITY % brandDTD SYSTEM "chrome://branding/locale/brand.dtd" > %brandDTD;
	<!ENTITY % trellisDTD SYSTEM "chrome://trellis/locale/trellis.dtd"> %trellisDTD;
]>

<window id="main-window"
		xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
		windowtype="navigator:browser" 
		title="&brandShortName;"
		width="1000" height="600"
		persist="screenX screenY width height sizemode"
		xmlns:html="http://www.w3.org/1999/xhtml"
		style="display: flex;"
		tooltip="html-tooltip">
	
	<linkset>
		<html:link rel="localization" href="browser/menubar.ftl"/>
		<html:link rel="localization" href="browser/browserSets.ftl"/>
		<html:link rel="localization" href="trellis.ftl"/>
		<html:link rel="localization" href="reader.ftl"/>
	</linkset>
	
	<script>
		var { Trellis } = ChromeUtils.importESModule("chrome://trellis/content/trellis.mjs");
		
		Services.scriptloader.loadSubScript("resource://trellis/require.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/standalone/standalone.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/titlebar.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/platformKeys.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/editMenuOverlay.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/browserWindowShim.js", this);
		
		// Mozilla scripts
		Services.scriptloader.loadSubScript("chrome://global/content/globalOverlay.js", this);
		Services.scriptloader.loadSubScript("chrome://global/content/contentAreaUtils.js", this);
		if (Trellis.isMac) {
			Services.scriptloader.loadSubScript("chrome://global/content/macWindowMenu.js", this);
		}
		Services.scriptloader.loadSubScript("chrome://global/content/printUtils.js", this);

		// Custom elements
		Services.scriptloader.loadSubScript("chrome://trellis/content/customElements.js", this);

		Services.scriptloader.loadSubScript("chrome://trellis/content/tabs.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/trellisPane.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/contextPane.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/fileInterface.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/reportInterface.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/progressQueueDialog.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/lookup.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/locateMenu.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/menuAccessKey.js", this);
		Services.scriptloader.loadSubScript("chrome://trellis/content/containers/tagSelectorContainer.js", this);
	</script>
	
	<commandset id="mainCommandSet">
		<!--FILE-->
		<command id="cmd_quitApplication" oncommand="goQuitApplication(event);"/>
		<command id="cmd_close" oncommand="TrellisPane.handleClose(event)"/>
		
		<!--EDIT-->
		<command id="cmd_find"
			oncommand="document.getElementById('trellis-tb-search-textbox').select()"/>
			
		<command id="cmd_trellis_reportErrors" oncommand="TrellisPane_Local.reportErrors();"/>
		<command id="cmd_trellis_import" oncommand="Trellis_File_Interface.showImportWizard();"/>
		<command id="cmd_trellis_importFromClipboard" oncommand="Trellis_File_Interface.importFromClipboard();"/>
		<command id="cmd_trellis_exportLibrary" oncommand="Trellis_File_Interface.exportFile();"/>
		<command id="cmd_trellis_advancedSearch" oncommand="TrellisPane.toggleAdvancedSearchState('open');"/>
		<command id="cmd_trellis_copyCitation"
				 oncommand="TrellisPane_Local.copySelectedItemsToClipboard(true);"
				 disabled="true"/>
		<command id="cmd_trellis_copyBibliography"
				 oncommand="TrellisPane_Local.copySelectedItemsToClipboard();"
				 disabled="true"/>
		<command id="cmd_trellis_copyAnnotation"
				 oncommand="TrellisPane_Local.copySelectedItemsToClipboard();"
				 disabled="true"/>
		<command id="cmd_trellis_createTimeline" oncommand="Trellis_Timeline_Interface.loadTimeline();"/>
		<command id="cmd_trellis_rtfScan" oncommand="window.openDialog('chrome://trellis/content/rtfScan.xhtml', 'rtfScan', 'chrome,centerscreen')"/>
		<command id="cmd_trellis_newCollection" oncommand="TrellisPane_Local.newCollection(TrellisPane_Local.getSelectedCollection()?.key)"/>
		<command id="cmd_trellis_newFeed_fromURL" oncommand="TrellisPane_Local.newFeedFromURL()"/>
		<command id="cmd_trellis_addByIdentifier" oncommand="Trellis_Lookup.showPanel()"/>
		<command id="cmd_trellis_newStandaloneFileAttachment" oncommand="TrellisPane.addAttachmentFromDialog()"/>
		<command id="cmd_trellis_newStandaloneLinkedFileAttachment" oncommand="TrellisPane.addAttachmentFromDialog(true)"/>
		<command id="cmd_trellis_newChildFileAttachment" oncommand="TrellisPane.addAttachmentFromDialog(false, TrellisPane.getSelectedItems()[0].id)"/>
		<command id="cmd_trellis_newChildLinkedFileAttachment" oncommand="TrellisPane.addAttachmentFromDialog(true, TrellisPane.getSelectedItems()[0].id)"/>
		<command id="cmd_trellis_newChildURLAttachment" oncommand="TrellisPane.addAttachmentFromURI(true, TrellisPane.getSelectedItems()[0].id)"/>
		<command id="cmd_trellis_newStandaloneNote" oncommand="TrellisPane_Local.newNote(event.shiftKey);"/>
		<command id="cmd_trellis_newChildNote" oncommand="TrellisPane_Local.newChildNote(event.shiftKey);"/>
        <command id="cmd_trellis_selectAll" oncommand="TrellisPane.selectAll();"/>
		
		<command id="cmd_trellis_showTabsMenu" oncommand="Trellis_Tabs.showTabsMenu()"/>
	</commandset>

	<commandset id="macCommandSet"> <!-- was mainCommandSet -->
		<command id="minimizeWindow"
				 data-l10n-id="window-minimize-command"
				 oncommand="window.minimize();" />
		<command id="zoomWindow"
				 data-l10n-id="window-zoom-command"
				 oncommand="zoomWindow();" />
	</commandset>

	<keyset id="macKeyset">  <!-- was mainKeySet -->
		<key id="key_minimizeWindow"
			 command="minimizeWindow"
			 data-l10n-id="window-minimize-shortcut"
			 modifiers="accel"
			 internal="true"/>
		<key id="key_openHelpMac"
			 oncommand="TrellisStandalone.openHelp();"
			 key="&helpMac.commandkey;"
			 modifiers="accel"/>
	</keyset>

	<keyset id="mainKeyset">
		<key id="key_close" key="&closeCmd.key;" command="cmd_close" modifiers="accel"/>
		<key id="key_quitApplication"
			key="&quitApplicationCmdMac.key;"
			command="cmd_quitApplication"
			modifiers="accel"
			internal="true"/>
		<key id="key_import"
				key="&importCmd.key;"
				command="cmd_trellis_import"
				modifiers="accel shift"/>
		<key id="key_importFromClipboard"
				key="&importCmd.key;"
				command="cmd_trellis_importFromClipboard"
				modifiers="accel shift alt"/>
		<key id="key_copyCitation"
				command="cmd_trellis_copyCitation"
				modifiers="accel shift"/>
		<key id="key_copyBibliography"
				command="cmd_trellis_copyBibliography"
				modifiers="accel shift"/>
		<key id="key_advancedSearch"
				command="cmd_trellis_advancedSearch"
				key="&findCmd.key;"
				modifiers="accel,shift"/>
		<key id="key_back"/>
		<key id="key_forward"/>
		<key id="key_showTabsMenu"
				command="cmd_trellis_showTabsMenu"
				modifiers="accel"/>
	</keyset>

	<keyset id="editMenuKeys">
		<key id="key_undo" data-l10n-id="text-action-undo-shortcut" modifiers="accel" command="cmd_undo"/>
		<!-- l10n and modifiers set in platformKeys.js -->
		<key id="key_redo" command="cmd_redo"/>
		<key id="key_cut" data-l10n-id="text-action-cut-shortcut" modifiers="accel" command="cmd_cut"/>
		<key id="key_copy" data-l10n-id="text-action-copy-shortcut" modifiers="accel" command="cmd_copy"/>
		<key id="key_paste" data-l10n-id="text-action-paste-shortcut" modifiers="accel" command="cmd_paste"/>
		<key id="key_delete" keycode="VK_DELETE" command="cmd_delete"/>
		<key id="key_selectAll" data-l10n-id="text-action-select-all-shortcut" modifiers="accel" command="cmd_selectAll"/>
		<key id="key_switchTextDirection" data-l10n-id="bidi-switch-direction-shortcut" command="cmd_switchTextDirection" modifiers="accel,shift" />
		<key id="key_find" key="&findCmd.key;" modifiers="accel" command="cmd_find"/>
		<key id="key_findAgain" key="&findAgainCmd.key;" modifiers="accel" command="cmd_findAgain"/>
		<key id="key_findPrevious" key="&findAgainCmd.key;" modifiers="shift,accel" command="cmd_findPrevious"/>
		<key id="key_findAgain2" keycode="&findAgainCmd.key2;" command="cmd_findAgain"/>
		<key id="key_findPrevious2" keycode="&findAgainCmd.key2;" modifiers="shift" command="cmd_findPrevious"/>
	</keyset>
	
	<keyset id="sortSubmenuKeys">
		<!-- Attributes are set in initItemsTree(), but these don't work on Windows if they're
		     created in JS -->
		<key id="key_sortCol0"/>
		<key id="key_sortCol1"/>
		<key id="key_sortCol2"/>
		<key id="key_sortCol3"/>
		<key id="key_sortCol4"/>
		<key id="key_sortCol5"/>
		<key id="key_sortCol6"/>
		<key id="key_sortCol7"/>
		<key id="key_sortCol8"/>
		<key id="key_sortCol9"/>
	</keyset>
	
	<vbox id="titlebar">
		<hbox class="titlebar-icon-container">
			<html:div class="titlebar-icon"></html:div>
		</hbox>
		<!-- Menu -->
		<!-- TEMP: Should be <toolbar>, but only HTML -moz-window-dragging: drag elements have rclick menu on Windows -->
		<html:div type="menubar" id="toolbar-menubar" class="chromeclass-menubar" customizable="true"
				defaultset="menubar-items"
				mode="icons" iconsize="small" defaulticonsize="small" autohide="false"
				context="toolbar-context-menu">
			<toolbaritem id="menubar-items" align="center">
				<!-- TODO: Localize labels -->
				<!--
					On macOS the document's top-most menubar node is used and
					there is no way to change it after the initialization, only
					the children can be modified. All non-menu nodes are ignored
				-->
				<menubar id="main-menubar"
				style="border:0px;padding:0px;margin:0px;-moz-appearance:none">		
					<!-- File menu -->
					<menu id="fileMenu" label="&fileMenu.label;" accesskey="&fileMenu.accesskey;">
						<menupopup id="menu_FilePopup"
									onpopupshowing="TrellisStandalone.onFileMenuOpen(event)">
							<menu id="menu_newItem" class="menu-type-library" label="&trellis.toolbar.newItem.label;">
								<menupopup id="menu_NewItemPopup"
										onpopupshowing="TrellisStandalone.buildNewItemMenu()"/>
							</menu>
							<menuitem
								id="menu_addByIdentifier"
								class="menu-type-library"
								data-l10n-id="menu-add-by-identifier"
								command="cmd_trellis_addByIdentifier"
							/>
							<menu
									id="menu_attachmentAdd"
									class="menu-type-library"
									data-l10n-id="menu-add-attachment">
								<menupopup onpopupshowing="TrellisPane.updateAddAttachmentMenu(event, this)">
									<menuitem
										data-l10n-id="menu-add-standalone-file-attachment"
										command="cmd_trellis_newStandaloneFileAttachment"
									/>
									<menuitem
										data-l10n-id="menu-add-standalone-linked-file-attachment"
										command="cmd_trellis_newStandaloneLinkedFileAttachment"
									/>
									<menuseparator/>
									<menuitem
										data-l10n-id="menu-add-child-file-attachment"
										command="cmd_trellis_newChildFileAttachment"
									/>
									<menuitem
										data-l10n-id="menu-add-child-linked-file-attachment"
										command="cmd_trellis_newChildLinkedFileAttachment"
									/>
									<menuitem
										data-l10n-id="menu-add-child-linked-url-attachment"
										command="cmd_trellis_newChildURLAttachment"
									/>
								</menupopup>
							</menu>
							<menu
									id="menu_noteAdd"
									class="menu-type-library"
									data-l10n-id="menu-new-note">
								<menupopup onpopupshowing="TrellisPane_Local.updateNewNoteMenu(event, this)">
									<menuitem
										data-l10n-id="menu-new-standalone-note"
										command="cmd_trellis_newStandaloneNote"
									/>
									<menuitem
										data-l10n-id="menu-new-item-note"
										command="cmd_trellis_newChildNote"
									/>
								</menupopup>
							</menu>
							<menuseparator class="menu-type-library"/>
							<menuitem id="menu_newCollection" class="menu-type-library"
									data-l10n-id="menu-new-collection"
									command="cmd_trellis_newCollection"/>
							<menuitem id="menu_groupAdd" class="menu-type-library"
									label="&trellis.toolbar.newGroup;"
									oncommand="TrellisPane_Local.newGroup()"/>
							<menu id="menu_feedAddMenu" class="menu-type-library" label="&trellis.toolbar.feeds.new;">
								<menupopup>
									<menuitem id="menu_feedAddFromURL" label="&trellis.toolbar.feeds.new.fromURL;" 
										command="cmd_trellis_newFeed_fromURL"/>
									<menuitem id="menu_feedAddFromOPML" label="&trellis.toolbar.feeds.new.fromOPML;" 
										oncommand="TrellisPane_Local.importFeedsFromOPML()"/>
								</menupopup>
							</menu>
							<menuitem
								id="menu_transferFromPDF"
								class="menu-type-reader pdf"
								label="&trellis.pdfReader.transferFromPDF;"
								oncommand="TrellisStandalone.currentReader.transferFromPDF()"
							/>
							<menuitem
								id="menu_importFromEPUB"
								class="menu-type-reader epub"
								data-l10n-id="reader-import-from-epub"
								oncommand="TrellisStandalone.currentReader.importFromEPUB()"
							/>
							<menuseparator class="menu-type-reader pdf"/>
							<menuitem id="menu_export_file" class="menu-type-reader pdf"
									label="&trellis.general.saveAs;"
									oncommand="TrellisStandalone.currentReader.export()"/>
							<menuseparator class="menu-type-reader pdf"/>
							<menuitem id="menu_print" data-l10n-id="menu-print" class="menu-type-reader" oncommand="TrellisStandalone.currentReader.print()"/>
							<menuitem id="menu_showInLibrary" label="&trellis.items.menu.showInLibrary;" class="menu-type-reader menu-type-note" oncommand="TrellisPane.showInLibrary()"/>
							<menuseparator/>
							<menuitem id="menu_close" class="menu-type-library" label="&closeCmd.label;" key="key_close"
									accesskey="&closeCmd.accesskey;" command="cmd_close"/>
							<menuitem id="menu_close_tab" class="menu-type-reader menu-type-note" label="&closeCmd.label;" key="key_close"
									accesskey="&closeCmd.accesskey;" oncommand="Trellis_Tabs.close()"/>
							<menuseparator class="menu-type-library"/>
							<menuitem id="menu_showFile"
									class="menu-type-library"
									oncommand="TrellisPane.showItemsInFilesystem()"/>
							<menuitem id="menu_export_files" class="menu-type-library"
									oncommand="TrellisPane.exportSelectedFiles()"
									hidden="true"/>
							<menuseparator class="menu-type-library"/>
							<menuitem id="menu_import" class="menu-type-library" label="&importCmd.label;"
									command="cmd_trellis_import" key="key_import"/>
							<menuitem id="menu_importFromClipboard" class="menu-type-library" label="&importFromClipboardCmd.label;"
									command="cmd_trellis_importFromClipboard" key="key_importFromClipboard"/>
							<menuitem id="menu_exportLibrary" class="menu-type-library" label="&trellis.toolbar.export.label;"
									command="cmd_trellis_exportLibrary"/>
							<menuseparator id="menu_fileQuitSeparatorNonMac"/>
							<menuitem id="menu_fileQuitItemWin"
									label="&quitApplicationCmdWin.label;"
									accesskey="&quitApplicationCmdWin.accesskey;"
									command="cmd_quitApplication"/>
							<menuitem id="menu_fileQuitItemUnix"
									label="&quitApplicationCmd.label;"
									key="key_quitApplication"
									command="cmd_quitApplication"/>
						</menupopup>
					</menu>
					
					<menu id="edit-menu" data-l10n-id="menu-edit">
						<menupopup id="menu_EditPopup"
									onpopupshowing="TrellisStandalone.onEditMenuOpen(event)">
							<menuitem id="menu_undo"
									key="key_undo"
									command="cmd_undo" data-l10n-id="text-action-undo"/>
							<menuitem id="menu_redo"
									key="key_redo"
									command="cmd_redo" data-l10n-id="text-action-redo"/>
							<menuseparator/>
							<menuitem id="menu_cut"
									key="key_cut"
									command="cmd_cut" data-l10n-id="text-action-cut"/>
							<menuitem id="menu_copy"
									key="key_copy"
									command="cmd_copy" data-l10n-id="text-action-copy"/>
							<menuitem id="menu_copyCitation"
									label="&copyCitationCmd.label;"
									command="cmd_trellis_copyCitation"
									key="key_copyCitation"
									hidden="true"/>
							<menuitem id="menu_copyBibliography"
									label="&copyBibliographyCmd.label;"
									command="cmd_trellis_copyBibliography"
									key="key_copyBibliography"
									hidden="true"/>
							<menuitem id="menu_copyExport"
									class="menu-type-library"
									key="key_copyBibliography"
									command="cmd_trellis_copyBibliography"
									hidden="true"/>
							<menuitem id="menu_copyNote"
									label="&copyNoteCmd.label;"
									command="cmd_trellis_copyBibliography"
									key="key_copyBibliography"
									hidden="true"/>
							<menuitem id="menu_copyAnnotation"
									data-l10n-id="menu-edit-copy-annotation"
									command="cmd_trellis_copyAnnotation"
									key="key_copyBibliography"
									hidden="true"/>
							<menuitem id="menu_paste"
									key="key_paste"
									command="cmd_paste" data-l10n-id="text-action-paste"/>
							<menuitem id="menu_delete"
									key="key_delete"
									command="cmd_delete" data-l10n-id="text-action-delete"/>
							<menuseparator/>
							<menuitem id="menu_selectAll"
									key="key_selectAll"
									command="cmd_trellis_selectAll" data-l10n-id="text-action-select-all"/>
							<menuseparator class="menu-type-reader pdf"/>
							<menuitem
									id="menu_rotateLeft"
									class="menu-type-reader pdf"
									label="&trellis.pdfReader.rotatePageLeft;"
									oncommand="TrellisStandalone.currentReader.rotatePageLeft()"
							/>
							<menuitem
									id="menu_rotateRight"
									class="menu-type-reader pdf"
									label="&trellis.pdfReader.rotatePageRight;"
									oncommand="TrellisStandalone.currentReader.rotatePageRight()"
							/>
							<menuseparator/>
							<menuitem id="menu_find" class="menu-type-library" label="&findCmd.label;"
									key="key_find" accesskey="&findCmd.accesskey;"
									command="cmd_find"/>
							<menuitem id="menu_find_reader" class="menu-type-reader" label="&findCmd.label;"
									key="key_find" accesskey="&findCmd.accesskey;"
									oncommand="TrellisStandalone.currentReader.toggleFindPopup({ open: true });"/>
							<menuitem id="menu_advancedSearch"
									data-l10n-id="menuitem-advanced-search"
									key="key_advancedSearch"
									command="cmd_trellis_advancedSearch"/>
							<menuseparator hidden="true" id="textfieldDirection-separator"/>
							<menuitem id="textfieldDirection-swap"
									command="cmd_switchTextDirection"
									key="key_switchTextDirection"
									hidden="true" data-l10n-id="menu-edit-bidi-switch-text-direction"/>
							<menuseparator id="menu_EditPreferencesSeparator"/>
							<menuitem id="menu_EditPreferencesItem"
								oncommand="Trellis.Utilities.Internal.openPreferences()" data-l10n-id="menu-settings"/>
						</menupopup>
					</menu>
					
					<menu id="view-menu"
							label="&viewMenu.label;"
							accesskey="&viewMenu.accesskey;">
						<menupopup id="menu_viewPopup"
									onpopupshowing="TrellisStandalone.onViewMenuOpen(event)">
							<menuitem
								id="view-menuitem-hand-tool"
								class="menu-type-reader pdf"
								type="checkbox"
								label="&trellis.pdfReader.handTool;"
								oncommand="TrellisStandalone.currentReader.toggleHandTool()"
							/>
							<menuseparator class="menu-type-reader pdf"/>
							<menuitem
								id="view-menuitem-vertical-scrolling"
								class="menu-type-reader pdf"
								type="checkbox"
								label="&trellis.pdfReader.verticalScrolling;"
								oncommand="TrellisStandalone.currentReader.scrollMode = 0"
							/>
							<menuitem
								id="view-menuitem-horizontal-scrolling"
								class="menu-type-reader pdf"
								type="checkbox"
								label="&trellis.pdfReader.horizontalScrolling;"
								oncommand="TrellisStandalone.currentReader.scrollMode = 1"
							/>
							<menuitem
								id="view-menuitem-wrapped-scrolling"
								class="menu-type-reader pdf"
								type="checkbox"
								label="&trellis.pdfReader.wrappedScrolling;"
								oncommand="TrellisStandalone.currentReader.scrollMode = 2"
							/>
							<menuseparator class="menu-type-reader pdf"/>
							<menuitem
								id="view-menuitem-no-spreads"
								class="menu-type-reader pdf epub"
								type="checkbox"
								label="&trellis.pdfReader.noSpreads;"
								oncommand="TrellisStandalone.currentReader.spreadMode = 0"
							/>
							<menuitem
								id="view-menuitem-odd-spreads"
								class="menu-type-reader pdf epub"

			<menuitem class="menuitem-iconic trellis-menuitem-merge-items" label="&trellis.items.menu.mergeItems;" oncommand="TrellisPane_Local.mergeSelectedItems();"/>
			<menuitem class="menuitem-iconic trellis-menuitem-relate-items" data-l10n-id="item-menu-relate-items" oncommand="TrellisPane_Local.relateSelectedItems();"/>

			<menuitem class="menuitem-iconic trellis-menuitem-export" oncommand="Trellis_File_Interface.exportItems();"/>
			<menuitem class="menuitem-iconic trellis-menuitem-create-bibliography" oncommand="Trellis_File_Interface.bibliographyFromItems();"/>
			<menuitem class="menuitem-iconic trellis-menuitem-create-report" oncommand="Trellis_Report_Interface.loadItemReport()"/>
			<menuseparator/>
			<menuitem class="menuitem-iconic trellis-menuitem-retrieve-metadata" oncommand="TrellisPane.recognizeSelected();"/>
			<menuitem class="menuitem-iconic trellis-menuitem-unrecognize" label="&trellis.items.menu.unrecognize;" oncommand="TrellisPane.unrecognizeSelected()"/>
			<menuitem class="menuitem-iconic trellis-menuitem-create-parent" oncommand="TrellisPane_Local.createParentItemsFromSelected();"/>

		<!-- Tag Selector -->
		<menupopup id="tag-menu">

			<menuitem id="rename-tag" label="&trellis.tagSelector.renameTag;"

				oncommand="TrellisPane.tagSelector.toggleDisplayAllTags();"
			/>

										oncommand="TrellisPane.tagSelector.deleteAutomatic();
											this.setAttribute('checked', false);"/>

		<!-- itemPane translateItem -->
		<menupopup id="trellis-item-addTo-menu" onpopupshowing="TrellisPane.itemPane.buildTranslateSelectContextMenu(event);"></menupopup>

		<!-- Autocomplete -->
		<panel
			is="autocomplete-richlistbox-popup"

			noautofocus="true"
			hidden="true"
			overflowpadding="4"
			norolluponanchor="true"
			nomaxresults="true"
		/>
	</popupset>
	
	<hbox flex="1" id="browser">
		<vbox id="appcontent" flex="1">
			<stack id="trellis-pane-stack" flex="1">
				<!-- A placeholder to persist pdf-reader sidebar collapse state to avoid introducing another pref -->
				<box id="trellis-reader-sidebar-pane" hidden="true" collapsed="true" trellis-persist="collapsed width"/>

				<hbox>
					<div id="trellis-tab-cover" class="hidden" xmlns="http://www.w3.org/1999/xhtml">
						<label>&trellis.general.loading;</label>
					</div>
					<deck id="tabs-deck">
						<tab-content id="trellis-pane"
							onkeydown="TrellisPane_Local.handleKeyDown(event, this.id)"
							onkeyup="TrellisPane_Local.handleKeyUp(event, this.id)"
							onkeypress="TrellisPane_Local.handleKeyPress(event)">
							
							<vbox id="post-upgrade-container" class="banner-container" collapsed="true" role="status">
								<html:div id="post-upgrade-banner" class="banner">
									<html:div
											id="post-upgrade-message"
											data-l10n-id="post-upgrade-message">
										<html:span
											id="post-upgrade-appver"
											data-l10n-name="post-upgrade-appver"/>
										<html:a
											id="post-upgrade-new-features-link"
											data-l10n-name="new-features-link"
											class="link"
											onclick="Trellis.launchURL(this.href)"
											tabindex="0"
										/>
									</html:div>
									<html:div id="post-upgrade-buttons">
										<button
											data-l10n-id="post-upgrade-remind-me-later"
											oncommand="TrellisPane.hidePostUpgradeBanner(true)"
										/>
										<button
											data-l10n-id="post-upgrade-done"
											oncommand="TrellisPane.hidePostUpgradeBanner(false)"
											default="true"
										/>
									</html:div>
								</html:div>
							</vbox>

							<vbox id="sync-reminder-container" class="banner-container"  collapsed="true" role="status">
								<html:div id="sync-reminder-banner" class="banner">
									<html:div id="sync-reminder-message" class="message"/>
									<html:a id="sync-reminder-action" class="link"/>
									<html:a id="sync-reminder-learn-more" class="link"/>
									<html:div class="spacer"/>
									<html:a id="sync-reminder-disable" class="link"/>
									<html:a id="sync-reminder-remind" class="link"/>
									<html:div role="button" id="sync-reminder-close" class="close-btn" data-l10n-id="banner-close-button">
										<html:span class="icon" />
									</html:div>
								</html:div>
							</vbox>
							
							<vbox id="mac-word-plugin-install-container" class="banner-container" collapsed="true" role="status">
								<html:div id="mac-word-plugin-install-banner" class="banner">
									<html:div class="message" data-l10n-id="mac-word-plugin-install-message" />
									<button
										id="mac-word-plugin-install-action"
										data-l10n-id="mac-word-plugin-install-action-button"
										default="true"/>
									<html:div class="spacer" />
									<button
										id="mac-word-plugin-install-remind-later"
										data-l10n-id="mac-word-plugin-install-remind-later-button"/>
									<!-- TODO: Use ftl string -->
									<button
										id="mac-word-plugin-install-dont-ask-again"/>
								</html:div>
							</vbox>
							
							<vbox id="retracted-items-container" class="banner-container" collapsed="true" role="status">
								<html:div id="retracted-items-banner" class="banner">
									<html:div id="retracted-items-message" class="message"/>
									<label is="text-link" id="retracted-items-link"/>
									<html:div role="button" id="retracted-items-close" class="close-btn" data-l10n-id="banner-close-button">
										<html:span class="icon" />
									</html:div>
								</html:div>
							</vbox>

							<vbox id="architecture-warning-container" class="banner-container" collapsed="true" role="status">
								<html:div id="architecture-warning-banner" class="banner">
									<html:div id="architecture-warning-message" class="message" data-l10n-id="architecture-win32-warning-message" />
									<html:a id="architecture-warning-action" data-l10n-id="architecture-warning-action" class="link" />
									<html:div class="spacer" />
									<label is="text-link" id="architecture-warning-remind" data-l10n-id="general-remind-me-later" />
									<html:div role="button" id="architecture-warning-close" class="close-btn" data-l10n-id="banner-close-button">
										<html:span class="icon" />
									</html:div>
								</html:div>
							</vbox>

							<vbox id="file-renaming-banner-container" class="banner-container" collapsed="true" role="status">
								<html:div id="file-renaming-banner" class="banner">
									<html:div id="file-renaming-message" class="message" data-l10n-id="file-renaming-banner-message" />
									<html:a id="file-renaming-documentation-link" data-l10n-id="file-renaming-banner-documentation-link" class="link" />
									<html:div class="spacer" />
									<html:div role="button" id="file-renaming-banner-close" class="close-btn" data-l10n-id="banner-close-button">
										<html:span class="icon" />
									</html:div>
								</html:div>
							</vbox>
							
							<hbox id="trellis-trees" flex="1">
								<vbox id="trellis-collections-pane" trellis-persist="width">
									<toolbar id="trellis-toolbar-collection-tree" tabindex="-1" class="trellis-toolbar toolbar toolbar-primary">
										<hbox id="trellis-collections-toolbar" align="center">
											<toolbarbutton id="trellis-tb-collection-add" tabindex="-1" class="trellis-tb-button" data-l10n-id="toolbar-new-collection" command="cmd_trellis_newCollection"/>
											<spacer flex="1"></spacer>
											<html:div style="display: flex;flex-direction: row; flex-grow: 0; flex-shrink: 1; min-width: 0;">
												<toolbarbutton id="trellis-tb-collections-search" data-l10n-id="trellis-collections-search-btn" tabindex="-1" class="trellis-tb-button"/>
												<search-textbox
													id="trellis-collections-search" class="hidden" disabled="true"
													data-l10n-id="trellis-collections-search"
													data-l10n-attrs="placeholder"
													oncommand="TrellisPane.handleCollectionSearchInput()"/>
											</html:div>
										</hbox>									
									</toolbar>
									<!-- This is used for positioning the sync error icon panel
											under specific tree cells, which don't exist as
											elements on their own -->
									<box id="trellis-collections-tree-shim"/>
									<!-- This extra vbox prevents the toolbar from getting compressed when resizing
											the tag selector to max height -->
									<vbox id="trellis-collections-tree-container" class="virtualized-table-container" flex="1" clickthrough="never">
										<html:div id="trellis-collections-tree"></html:div>
									</vbox>
									<splitter
										id="trellis-tags-splitter"
										orient="vertical"
										collapse="after"
										trellis-persist="state"
										onmousemove="if (this.getAttribute('state') == 'dragging') { TrellisPane.handleTagSelectorResize(); }"
									>
										<grippy oncommand="TrellisPane.toggleTagSelector()"/>
									</splitter>
									<!-- 'collapsed' is no longer necessary here due to the persisted 'state' on
										 trellis-tags-splitter, but without this an old-style entry for 'collapsed'
										 in localstore.rdf can cause the pane to always be closed on Trellis open.
										 
										 TODO: deal with this some other way?
									-->
									<vbox id="trellis-tag-selector-container" trellis-persist="height,collapsed" clickthrough="never">
										<html:div id="trellis-tag-selector" label="&tagSelector.label;"/>
									</vbox>
								</vbox>
								
								<splitter id="trellis-collections-splitter" resizebefore="closest" resizeafter="closest" collapse="before"
									trellis-persist="state"
									onmousemove="document.getElementById('trellis-items-toolbar').setAttribute('state', this.getAttribute('state'));TrellisPane_Local.updateLayoutConstraints();"
									oncommand="TrellisPane_Local.updateLayoutConstraints()">
									<grippy id="trellis-collections-grippy"/>
								</splitter>
								
								<box id="trellis-layout-switcher" orient="horizontal" trellis-persist="orient">
									<vbox id="trellis-items-pane-container">
										<toolbar id="trellis-toolbar-item-tree" tabindex="-1" class="trellis-toolbar toolbar toolbar-primary">
											<hbox id="trellis-items-toolbar" align="center" flex="1">
												<toolbarbutton
														id="trellis-tb-add"
														class="trellis-tb-button"
														tabindex="-1"
														tooltiptext="&trellis.toolbar.newItem.label;"
														type="menu"
														wantdropmarker="true"
														onmousedown="if (this.disabled) { event.preventDefault(); return; }">
													<menupopup onpopupshowing="TrellisPane_Local.updateNewItemTypes()"></menupopup>
												</toolbarbutton>
												
												<toolbarbutton
													id="trellis-tb-lookup"
													tabindex="-1"
													class="trellis-tb-button"
													tooltiptext="&trellis.toolbar.lookup.label;"
													type="panel"
													onmousedown="Trellis_Lookup.handleToolbarButtonMouseDown(event)"
												/>
												
												<panel id="trellis-lookup-panel" type="arrow" animate="false"
														noautohide="true"
														onpopupshown="Trellis_Lookup.onShown(event)"
														onpopuphidden="Trellis_Lookup.onHidden(event)"
														onfocusout="Trellis_Lookup.onFocusOut(event)"
												>
													<vbox>
														<label control="trellis-lookup-textbox">&trellis.lookup.description;</label>
														<vbox id="trellis-lookup-multiline">
															<html:textarea
																id="trellis-lookup-textbox"
																onkeypress="Trellis_Lookup.onKeyPress(event, this)"
																oninput="Trellis_Lookup.onInput(event, this)"
																oncontextmenu="Trellis_Lookup.onContextMenu(event, this)"
																rows="1"
																wrap="off"/>
															<hbox id="trellis-lookup-buttons" align="start" hidden="true">
																<button
																	align="start"
																	oncommand="Trellis_Lookup.accept(document.getElementById('trellis-lookup-textbox'))"
																	label="&trellis.lookup.button.search;"/>
																<html:progress id="trellis-lookup-multiline-progress" value="0" hidden="true" style="flex: 1"/>
															</hbox>
														</vbox>
													</vbox>
												</panel>
												
												<toolbarbutton
														id="trellis-tb-attachment-add"
														class="trellis-tb-button"
														tabindex="-1"
														data-l10n-id="toolbar-add-attachment"
														type="menu"
														wantdropmarker="true">
													<menupopup onpopupshowing="TrellisPane.updateAddAttachmentMenu(event, this)">
														<menuitem
															data-l10n-id="menu-add-standalone-file-attachment"
															command="cmd_trellis_newStandaloneFileAttachment"
														/>
														<menuitem
															data-l10n-id="menu-add-standalone-linked-file-attachment"
															command="cmd_trellis_newStandaloneLinkedFileAttachment"
														/>
														<menuseparator/>
														<menuitem
															data-l10n-id="menu-add-child-file-attachment"
															command="cmd_trellis_newChildFileAttachment"
														/>
														<menuitem
															data-l10n-id="menu-add-child-linked-file-attachment"
															command="cmd_trellis_newChildLinkedFileAttachment"
															id="trellis-tb-attachment-add-file-link"
														/>
														<menuitem
															data-l10n-id="menu-add-child-linked-url-attachment"
															command="cmd_trellis_newChildURLAttachment"
														/>
													</menupopup>
												</toolbarbutton>
												<toolbarbutton
														id="trellis-tb-note-add" class="trellis-tb-button" tooltiptext="&trellis.toolbar.newNote;"
														type="menu"
														tabindex="-1"
														wantdropmarker="true">
													<menupopup onpopupshowing="TrellisPane.updateNewNoteMenu(event, this)">
														<menuitem
															data-l10n-id="menu-new-standalone-note"
															command="cmd_trellis_newStandaloneNote"
														/>
														<menuitem
															data-l10n-id="menu-new-item-note"
															command="cmd_trellis_newChildNote"
														/>
													</menupopup>
												</toolbarbutton>
												
												<spacer flex="1"/>
												<image id="trellis-tb-search-spinner" class="trellis-spinner-16"/>
												<quick-search-textbox id="trellis-tb-search" timeout="250"
														onkeydown="TrellisPane_Local.handleSearchKeypress(this, event)"
														oninput="TrellisPane_Local.handleSearchInput(this, event)"
														oncommand="TrellisPane_Local.search()"/>
												
												<!-- Stacked mode only: Toggle Item Pane button -->
												<toolbarbutton
													id="trellis-tb-toggle-item-pane-stacked"
													class="trellis-tb-button"
													tabindex="-1"
													data-l10n-id="toggle-item-pane"
													oncommand="TrellisPane.toggleItemPane()"
												/>
											</hbox>
											
										</toolbar>
										<advanced-search-deck id="trellis-advanced-search-pane-deck"/>
										<hbox id="trellis-items-pane" class="virtualized-table-container" flex="1" clickthrough="never">
											<html:div id="trellis-items-tree"></html:div>
										</hbox>
									</vbox>
									
				
									<splitter id="trellis-items-splitter" resizebefore="closest" resizeafter="closest" collapse="after" orient="horizontal" trellis-persist="state orient"
										onmousemove="TrellisPane.updateLayoutConstraints()"
										oncommand="TrellisPane.updateLayoutConstraints()">
										<grippy id="trellis-items-grippy"/>
									</splitter>
				
									<!-- itemPane.xul -->
									<item-pane id="trellis-item-pane" trellis-persist="width height"/>
								</box>
							</hbox>
						</tab-content>
					</deck>
		
					<splitter id="trellis-context-splitter"
							  hidden="true"
							  state="collapsed"
							  resizebefore="closest"
							  resizeafter="closest"
							  collapse="after"
							  orient="horizontal"
							  trellis-persist="state"
							  onmousemove="TrellisContextPane.update()"
							  oncommand="TrellisContextPane.update()"
					>
						<grippy/>
					</splitter>
		
					<!-- contextPane -->
					<box id="trellis-context-pane" collapsed="true" trellis-persist="width">
						<vbox flex="1" style="min-width: 0; min-height: 0;">
							<box class="stacked-context-placeholder" flex="1"/>
							<splitter id="trellis-context-splitter-stacked"
									  state="collapsed"
									  class="stacked-splitter"
									  orient="vertical"
									  collapse="after"
									  trellis-persist="state"
									  resizebefore="closest"
									  resizeafter="closest"
									  onmousemove="TrellisContextPane.update()"
									  oncommand="TrellisContextPane.update()"
							>
								<grippy/>
							</splitter>
							<context-pane id="trellis-context-pane-inner" trellis-persist="height"></context-pane>
						</vbox>
						<item-pane-sidenav id="trellis-context-pane-sidenav" class="trellis-view-item-sidenav" hidden="true"/>
					</box>
				</hbox>
				
				<!-- Barrier to prevent tabbing into Trellis pane when busy -->
				<box id="trellis-pane-tab-catcher-bottom" hidden="true" align="center" pack="center" style="opacity: 0">
					<checkbox/>
				</box>
				
				<stack id="trellis-pane-overlay" flex="1" hidden="true">
					<box flex="1"/>
					
					<deck id="trellis-pane-overlay-deck" style="display: flex; justify-content: center;">
						<box id="trellis-pane-progress" flex="1" align="center" pack="center">
							<box id="trellis-pane-progress-box">
								<vbox id="trellis-pane-progressmeter-container" flex="1">
									<label id="trellis-pane-progress-label"/>
									<!-- See note in Trellis.showTrellisPaneProgressMeter()
									<progressmeter id="trellis-pane-progressmeter" mode="undetermined"/> -->
								</vbox>
							</box>
						</box>
					</deck>
				</stack>
				
			</stack>
		</vbox>
	</hbox>
</window>
